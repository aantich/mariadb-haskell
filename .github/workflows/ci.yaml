name: Package builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cabal:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.4.7', '9.6', '9.8', '9.10', '9.12']
        os: [ubuntu-latest, macos-latest]
        # GHC 9.4's bindist selects Gold, absent from the Ubuntu 26.04
        # runner. Keep this compiler on the Ubuntu 24.04 native toolchain.
        exclude:
          - ghc: '9.4.7'
            os: ubuntu-latest
        include:
          - ghc: '9.4.7'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.16.1.0'
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libkrb5-dev zlib1g-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: ~/.cabal
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('mariadb-haskell.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-
      - run: cabal update
      - run: cabal build all --enable-tests -O2
      - run: cabal test test --enable-tests -O2
      - run: python3 tools/update_ca_bundle.py --check
  crypton:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crypton: ['^>=2.1', '^>=2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'
          cabal-version: '3.16.1.0'
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev libkrb5-dev zlib1g-dev pkg-config
      - run: cabal update
      - run: cabal build lib:mariadb-haskell test:test --enable-tests -O2 --constraint='crypton ${{ matrix.crypton }}'
      - run: cabal test test --enable-tests -O2 --constraint='crypton ${{ matrix.crypton }}'
  source-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'
          cabal-version: '3.16.1.0'
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libkrb5-dev zlib1g-dev pkg-config
      - run: cabal update
      - name: Build and document the actual Hackage source archive
        run: python3 tools/check_release.py --build --output "${{ runner.temp }}/mariadb-release-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hackage-preparation-${{ runner.os }}
          path: |
            ${{ runner.temp }}/mariadb-release-check/*.log
            ${{ runner.temp }}/mariadb-release-check/checks.json
            ${{ runner.temp }}/mariadb-release-check/artifacts
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix-build nix/ci.nix
      - run: nix-shell --run 'ghc --numeric-version'
