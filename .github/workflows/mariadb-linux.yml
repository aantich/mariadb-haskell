name: MariaDB Linux integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated Linux MariaDB and Haskell profile
        run: docker build -f validation/linux/Dockerfile -t mariadb-haskell-linux .
      - name: Run unchanged correctness suite and additive regressions
        run: |
          mkdir -p validation/results/runs/stage2-linux
          mkdir -p "${{ runner.temp }}/mariadb-linux/cabal" "${{ runner.temp }}/mariadb-linux/build"
          docker run --name mariadb-haskell-linux \
            --tmpfs /var/lib/mysql:size=2147483648 --tmpfs /tmp:size=1073741824 \
            -v "${{ runner.temp }}/mariadb-linux/cabal:/root/.cabal" \
            -v "${{ runner.temp }}/mariadb-linux/build:/workspace/dist-newstyle" \
            mariadb-haskell-linux
      - name: Preserve all Linux evidence
        if: always()
        run: docker cp mariadb-haskell-linux:/workspace/validation/results/runs/stage2-linux/. validation/results/runs/stage2-linux/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mariadb-linux-evidence
          path: validation/results/runs/stage2-linux
      - name: Remove disposable profile
        if: always()
        run: docker rm -fv mariadb-haskell-linux || true
